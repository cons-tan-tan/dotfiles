[package]
name = "agent-config-helper"
version = "0.1.0"
edition = "2024"
publish = false
license = "CC0-1.0"
autobins = false

[features]
test-fixture = []

[lib]
path = "src/lib.rs"

[[bin]]
name = "agent-config-helper"
path = "src/main.rs"

[[bin]]
name = "agent-config-helper-fixture"
path = "tests/fixtures/app_server.rs"
required-features = ["test-fixture"]

[dependencies]
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = [
  "arbitrary_precision",
  "preserve_order",
] }
toml_edit = "0.25"

[dev-dependencies]
tempfile = "3.23"
