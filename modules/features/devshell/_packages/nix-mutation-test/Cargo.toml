[package]
name = "nix-mutation-test"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
license = "CC0-1.0"
autobins = false

[[bin]]
name = "nix-mutation-test"
path = "src/main.rs"

[dependencies]
libc = "0.2"
rnix = "0.14"
rowan = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
