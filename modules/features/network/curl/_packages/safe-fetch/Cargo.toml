[package]
name = "safe-fetch"
version = "0.1.0"
edition = "2024"
publish = false
license = "CC0-1.0"
autobins = false

[[bin]]
name = "curl-fetch"
path = "src/bin/curl-fetch.rs"

[[bin]]
name = "gh-api-get"
path = "src/bin/gh-api-get.rs"

[[bin]]
name = "safe-fetch-test-fixture"
path = "src/bin/safe-fetch-test-fixture.rs"
required-features = ["test-fixture"]

[features]
test-fixture = []

[dev-dependencies]
proptest = "1.8"
