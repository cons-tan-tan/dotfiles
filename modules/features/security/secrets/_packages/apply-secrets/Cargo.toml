[package]
name = "apply-secrets"
version = "0.1.0"
edition = "2024"
publish = false
license = "CC0-1.0"

[[bin]]
name = "apply-secrets-sops-test-fixture"
path = "tests/fixtures/sops.rs"
required-features = ["test-fixture"]

[features]
test-fixture = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = [
  "arbitrary_precision",
  "preserve_order",
] }
tempfile = "3.20"
thiserror = "2.0"
