[package]
name = "oo7-dpapi-bridge"
version = "0.1.0"
edition = "2024"
publish = false
license = "CC0-1.0"

[[bin]]
name = "wsl-dpapi-test-fixture"
path = "src/bin/wsl-dpapi-test-fixture.rs"
required-features = ["test-fixture"]

[features]
test-fixture = []

[dependencies]
getrandom = "0.4"
oo7 = { version = "0.6", default-features = false, features = [
  "native_crypto",
  "tokio",
] }
tempfile = "3.25"
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "time"] }
zeroize = "1.8"
