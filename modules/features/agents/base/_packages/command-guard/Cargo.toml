[package]
name = "agent-command-guard"
version = "0.1.0"
edition = "2024"
publish = false
license = "CC0-1.0"
autobins = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "agent-command-guard"
path = "src/main.rs"

[dependencies]
lexopt = "=0.3.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shellfirm = { version = "=0.3.10", default-features = false }
thiserror = "2.0"
tree-sitter = "0.25"
tree-sitter-bash = "=0.25.1"

[dev-dependencies]
tempfile = "3.23"
