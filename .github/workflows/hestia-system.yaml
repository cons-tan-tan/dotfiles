name: Hestia system

on:
  workflow_call:
    inputs:
      system:
        description: Nix system exposed under lib.hestiaJobs.ci
        required: true
        type: string

permissions:
  contents: read

jobs:
  evaluate:
    name: evaluate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      any-jobs: ${{ steps.matrix.outputs.any-jobs }}
      manifest-version: ${{ steps.matrix.outputs.manifest-version }}
    steps:
      - name: Check out repository
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        background: true
        with:
          persist-credentials: false
      - name: Set up Nix and Hestia
        uses: $/.github/actions/setup-hestia
        with:
          filter-drv-closures: "true"
      - wait: checkout
      - name: Evaluate Hestia matrix
        id: hestia-matrix
        uses: Mic92/hestia/matrix@dfed9ced335d28978ba74e513939a10db1f71025 # v3.1.0
        with:
          flake: ".#lib.hestiaJobs.ci.${{ inputs.system }}"
          # 16 GB runner上で評価workerの再起動を避けつつ、OSとNix daemon用に4 GBを残す。
          nix-eval-jobs: python3 modules/features/ci/_scripts/capture_hestia_eval.py
          attr-prefix: "lib.hestiaJobs.ci.${{ inputs.system }}"
      - id: optimized-matrix
        name: Optimize system matrix
        shell: bash
        env:
          HESTIA_ANY_JOBS: ${{ steps.hestia-matrix.outputs.any-jobs }}
          HESTIA_MATRIX: ${{ steps.hestia-matrix.outputs.matrix }}
          SYSTEM: ${{ inputs.system }}
        run: python3 modules/features/ci/_scripts/optimize_hestia_matrix.py
      - id: matrix
        name: Validate system matrix
        shell: bash
        env:
          HESTIA_ANY_JOBS: ${{ steps.hestia-matrix.outputs.any-jobs }}
          HESTIA_MANIFEST_VERSION: ${{ steps.hestia-matrix.outputs.manifest-version }}
          HESTIA_MATRIX: ${{ steps.optimized-matrix.outputs.matrix }}
          HESTIA_ORIGINAL_MATRIX: ${{ steps.hestia-matrix.outputs.matrix }}
          SYSTEM: ${{ inputs.system }}
        run: python3 modules/features/ci/_scripts/validate_hestia_matrix.py

  # 評価済みのdrv closureを引き継ぎ、評価とbuildが別のderivationを選ぶ余地を作らない。
  build:
    name: build / ${{ matrix.name }}
    needs: evaluate
    if: >-
      needs.evaluate.result == 'success'
      && needs.evaluate.outputs.any-jobs == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.evaluate.outputs.matrix) }}
    steps:
      - name: Check out CI scripts
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        background: true
        with:
          persist-credentials: false
          sparse-checkout: modules/features/ci/_scripts
      - name: Set up Nix and Hestia
        id: setup-hestia
        uses: $/.github/actions/setup-hestia
        with:
          wait-manifest-version: ${{ needs.evaluate.outputs.manifest-version }}
      - wait: checkout
      - name: Verify Hestia and upstream substituters
        env:
          NIX_EXTRA_SUBSTITUTERS: ${{ steps.setup-hestia.outputs.nix-extra-substituters }}
        run: bash modules/features/ci/_scripts/verify_binary_substituters.sh
      - name: Prefetch derivation closure and build
        env:
          INSTALLABLES: ${{ matrix.installables }}
        run: python3 modules/features/ci/_scripts/run_hestia_build.py
