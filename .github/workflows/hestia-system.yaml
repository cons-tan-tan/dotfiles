name: Hestia system

on:
  workflow_call:
    inputs:
      system:
        description: Nix system exposed under hydraJobs.ci
        required: true
        type: string

permissions:
  contents: read

# GitHub Actionsはflake.nixのnixConfigをNixのインストール前には読めない。
# 公開cache設定はここで宣言し、Nix側との一致をworkflow-policy-testsで検証する。
env:
  NIX_EXTRA_SUBSTITUTERS: >-
    https://cache.numtide.com
    https://nix-community.cachix.org
  NIX_EXTRA_TRUSTED_PUBLIC_KEYS: >-
    niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=
    nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
  HESTIA_VERSION: v3.0.0
  HESTIA_UPSTREAM_CACHE_KEY_NAMES: >-
    cache.nixos.org-1
    niks3.numtide.com-1
    nix-community.cachix.org-1

jobs:
  evaluate:
    name: evaluate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      any-jobs: ${{ steps.matrix.outputs.any-jobs }}
      manifest-version: ${{ steps.matrix.outputs.manifest-version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          enable_kvm: false
          nix_conf: |
            extra-substituters = ${{ env.NIX_EXTRA_SUBSTITUTERS }}
            extra-trusted-public-keys = ${{ env.NIX_EXTRA_TRUSTED_PUBLIC_KEYS }}
      - name: Start Hestia
        uses: Mic92/hestia@b21a1aaf8c3d5c2e430c9ba278c0f78abd46a320 # v3.0.0
        with:
          version: ${{ env.HESTIA_VERSION }}
          upstream-cache-filter: true
          upstream-cache-key-names: ${{ env.HESTIA_UPSTREAM_CACHE_KEY_NAMES }}
      - name: Evaluate Hestia matrix
        id: hestia-matrix
        uses: Mic92/hestia/matrix@b21a1aaf8c3d5c2e430c9ba278c0f78abd46a320 # v3.0.0
        with:
          flake: ".#hydraJobs.ci.${{ inputs.system }}"
          # 16 GB runner上で評価workerの再起動を避けつつ、OSとNix daemon用に
          # 4 GBを残す。
          nix-eval-jobs: >-
            nix run
            nixpkgs#nix-eval-jobs
            --inputs-from .
            --
            --workers 1
            --max-memory-size 12288
          attr-prefix: "hydraJobs.ci.${{ inputs.system }}"
      - id: matrix
        name: Validate system matrix
        shell: bash
        env:
          HESTIA_ANY_JOBS: ${{ steps.hestia-matrix.outputs.any-jobs }}
          HESTIA_MANIFEST_VERSION: ${{ steps.hestia-matrix.outputs.manifest-version }}
          HESTIA_MATRIX: ${{ steps.hestia-matrix.outputs.matrix }}
          SYSTEM: ${{ inputs.system }}
        run: python3 modules/features/ci/_scripts/validate_hestia_matrix.py

  # 評価済みのdrv closureを引き継ぎ、評価とbuildが別のderivationを選ぶ余地を
  # 作らない。
  build:
    name: build / ${{ matrix.name }} (${{ matrix.system }})
    needs: evaluate
    if: >-
      needs.evaluate.result == 'success'
      && needs.evaluate.outputs.any-jobs == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.evaluate.outputs.matrix) }}
    steps:
      - name: Check out CI scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: modules/features/ci/_scripts
      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          enable_kvm: false
          nix_conf: |
            extra-substituters = ${{ env.NIX_EXTRA_SUBSTITUTERS }}
            extra-trusted-public-keys = ${{ env.NIX_EXTRA_TRUSTED_PUBLIC_KEYS }}
      - name: Start Hestia
        uses: Mic92/hestia@b21a1aaf8c3d5c2e430c9ba278c0f78abd46a320 # v3.0.0
        with:
          version: ${{ env.HESTIA_VERSION }}
          upstream-cache-filter: true
          upstream-cache-key-names: ${{ env.HESTIA_UPSTREAM_CACHE_KEY_NAMES }}
          wait-manifest-version: ${{ needs.evaluate.outputs.manifest-version }}
      - name: Verify binary substituters
        run: bash modules/features/ci/_scripts/verify_binary_substituters.sh
      - name: Prefetch derivation closure and build
        env:
          INSTALLABLES: ${{ matrix.installables }}
        run: bash modules/features/ci/_scripts/prefetch_hestia_closure_and_build.sh

  result:
    name: result
    needs:
      - evaluate
      - build
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify system result
        env:
          ANY_JOBS: ${{ needs.evaluate.outputs.any-jobs }}
          BUILD_RESULT: ${{ needs.build.result }}
          EVAL_RESULT: ${{ needs.evaluate.result }}
        run: |
          set -euo pipefail
          if [[ "$EVAL_RESULT" != success ]]; then
            echo "matrix evaluation failed: $EVAL_RESULT" >&2
            exit 1
          fi
          if [[ "$ANY_JOBS" == true ]]; then
            if [[ "$BUILD_RESULT" != success ]]; then
              echo "matrix build failed: $BUILD_RESULT" >&2
              exit 1
            fi
          elif [[ "$ANY_JOBS" == false ]]; then
            if [[ "$BUILD_RESULT" != skipped ]]; then
              echo "unexpected empty matrix result: $BUILD_RESULT" >&2
              exit 1
            fi
          else
            echo "invalid any-jobs output: $ANY_JOBS" >&2
            exit 1
          fi
