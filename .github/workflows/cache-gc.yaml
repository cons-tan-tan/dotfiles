name: Cache GC

on:
  schedule:
    # デフォルトブランチで、生存中のrootから参照されなくなったキャッシュを毎日回収する。
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Plan deletions without changing the cache
        type: boolean
        default: false

# GC間のrepackと削除が競合しないよう、手動実行も直列化する。
concurrency:
  group: hestia-gc
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gc:
    # workflow_dispatchでは任意のrefを選べるが、Hestia GCはデフォルトブランチのcache viewを基準に実行する必要がある。
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
    steps:
      - name: Set up Nix and Hestia
        uses: $/.github/actions/setup-hestia
        with:
          upstream-cache-filter: "false"
      - name: Run Hestia garbage collection
        run: |
          "$HESTIA_BIN" gc \
            ${{ inputs.dry-run && '--dry-run' || '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
