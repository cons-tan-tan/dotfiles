name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一refの旧runをキャンセルする。build matrixがmozuku-lspをソースから
# ビルドするため、force-push時の並走を避ける。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flake-eval:
    name: evaluate / flake
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          enable_kvm: false
      # Hestiaのsystem laneとは独立して開始する。eval時のIFDを排除して
      # あるため、Darwinを含む全systemをLinuxで評価できる。
      - name: Evaluate flake outputs
        run: nix flake check --no-build --all-systems

  linux:
    name: linux
    uses: ./.github/workflows/hestia-system.yaml
    with:
      system: x86_64-linux

  darwin:
    name: darwin
    uses: ./.github/workflows/hestia-system.yaml
    with:
      system: aarch64-darwin

  # matrixの行数はcache状態で変わるため、固定名のcheckでflake評価と
  # system laneの完了を集約する。branch protectionはこのjobだけを参照できる。
  required:
    name: required
    needs:
      - flake-eval
      - linux
      - darwin
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify required results
        env:
          DARWIN_RESULT: ${{ needs.darwin.result }}
          FLAKE_EVAL_RESULT: ${{ needs.flake-eval.result }}
          LINUX_RESULT: ${{ needs.linux.result }}
        run: bash modules/features/ci/_scripts/verify_required_results.sh
