name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一refの旧runをキャンセルする。
# build matrixがmozuku-lspをソースからビルドするため、force-push時の並走を避ける。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flake-eval:
    name: flake / ${{ matrix.system }} / evaluate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        system:
          - aarch64-darwin
          - aarch64-linux
          - x86_64-linux
    steps:
      - name: Check out repository
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        background: true
        with:
          persist-credentials: false
      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          enable_kvm: false
      - wait: checkout
      # Hestiaのsystem laneとは独立して開始する。
      # eval時のIFDを排除してあるため、Darwinを含む各systemをLinuxで並列評価できる。
      - name: Evaluate flake outputs
        env:
          FLAKE_EVAL_SYSTEM: ${{ matrix.system }}
        run: nix flake check --no-build --option system "$FLAKE_EVAL_SYSTEM"

  linux:
    name: system / x86_64-linux
    uses: $/.github/workflows/hestia-system.yaml
    with:
      system: x86_64-linux

  darwin:
    name: system / aarch64-darwin
    uses: $/.github/workflows/hestia-system.yaml
    with:
      system: aarch64-darwin

  # Hestia build matrixの行数はcache状態で変わるため、固定名のcheckでflake評価とsystem laneの完了を集約する。
  # branch protectionはこのjobだけを参照できる。
  required:
    name: required
    needs:
      - flake-eval
      - linux
      - darwin
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out CI scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: modules/features/ci/_scripts
      - name: Verify required results
        env:
          DARWIN_RESULT: ${{ needs.darwin.result }}
          FLAKE_EVAL_RESULT: ${{ needs.flake-eval.result }}
          LINUX_RESULT: ${{ needs.linux.result }}
        run: bash modules/features/ci/_scripts/verify_required_results.sh
