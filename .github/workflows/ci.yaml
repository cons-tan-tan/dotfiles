name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一refの旧runをキャンセルする。
# build matrixがmozuku-lspをソースからビルドするため、force-push時の並走を避ける。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flake-eval:
    name: flake / ${{ matrix.system }} / evaluate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        system:
          - aarch64-darwin
          - aarch64-linux
          - x86_64-linux
    steps:
      - name: Check out repository
        id: checkout
        uses: actions/checkout@v7.0.1
        background: true
        with:
          persist-credentials: false
      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v35
        with:
          enable_kvm: false
      - wait: checkout
      # Hestiaのsystem laneとは独立して開始する。
      # eval時のIFDを排除してあるため、Darwinを含む各systemをLinuxで並列評価できる。
      - name: Evaluate flake outputs
        env:
          FLAKE_EVAL_SYSTEM: ${{ matrix.system }}
        run: nix flake check --no-build --option system "$FLAKE_EVAL_SYSTEM"

  linux:
    name: system / x86_64-linux
    uses: $/.github/workflows/hestia-system.yaml
    with:
      system: x86_64-linux

  darwin:
    name: system / aarch64-darwin
    uses: $/.github/workflows/hestia-system.yaml
    with:
      system: aarch64-darwin
