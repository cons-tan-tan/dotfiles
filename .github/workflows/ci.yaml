name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一refの旧runをキャンセルする。
# build matrixがmozuku-lspをソースからビルドするため、force-push時の並走を避ける。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flake-eval:
    name: flake / ${{ matrix.system }} / evaluate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        system:
          - aarch64-darwin
          - aarch64-linux
          - x86_64-linux
    steps:
      - name: Check out repository
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        background: true
        with:
          persist-credentials: false
      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          enable_kvm: false
      - wait: checkout
      # Hestiaのsystem laneとは独立して開始する。
      # eval時のIFDを排除してあるため、Darwinを含む各systemをLinuxで並列評価できる。
      - name: Record workflow job identity
        continue-on-error: true
        env:
          FLAKE_EVAL_SYSTEM: ${{ matrix.system }}
          TELEMETRY_IDENTITY: ${{ runner.temp }}/ci-telemetry/workflow-job-${{ matrix.system }}.json
          TELEMETRY_RUNNER_NAME: ${{ runner.name }}
        run: |
          python3 modules/features/ci/_scripts/write_workflow_job_identity.py \
            --role flake-eval \
            --system "$FLAKE_EVAL_SYSTEM" \
            --runner-name "$TELEMETRY_RUNNER_NAME" \
            --output "$TELEMETRY_IDENTITY"
      - name: Evaluate flake outputs
        env:
          FLAKE_EVAL_SYSTEM: ${{ matrix.system }}
        run: nix flake check --no-build --option system "$FLAKE_EVAL_SYSTEM"
      - name: Upload workflow job identity
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: >-
            ci-workflow-job-${{ github.run_id }}-${{ github.run_attempt }}-flake-eval-${{ matrix.system }}
          path: ${{ runner.temp }}/ci-telemetry/workflow-job-${{ matrix.system }}.json
          if-no-files-found: ignore
          retention-days: 7

  linux:
    name: system / x86_64-linux
    uses: $/.github/workflows/hestia-system.yaml
    with:
      system: x86_64-linux

  darwin:
    name: system / aarch64-darwin
    uses: $/.github/workflows/hestia-system.yaml
    with:
      system: aarch64-darwin
