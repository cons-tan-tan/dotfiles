name: Update pins upstream smoke

on:
  schedule:
    - cron: "37 4 * * 1"
  workflow_dispatch:

concurrency:
  group: update-pins-upstream-smoke
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          enable_kvm: false
      - name: Start Hestia
        uses: Mic92/hestia@b21a1aaf8c3d5c2e430c9ba278c0f78abd46a320 # v3.0.0
        with:
          version: v3.0.0
          upstream-cache-filter: true
          upstream-cache-key-names: >-
            cache.nixos.org-1
            niks3.numtide.com-1
            nix-community.cachix.org-1
      - name: Build private smoke executable
        id: build
        run: bash modules/features/ci/_scripts/update_pins_smoke.sh build-private
      # live contract検査はcloneやproduction updaterと作業treeを共有しないため、
      # build完了後すぐに開始する。waitはbackground側の失敗もjobへ反映する。
      - name: Check live upstream contracts
        id: live-upstream
        background: true
        env:
          UPDATE_PINS_SMOKE: ${{ steps.build.outputs.path }}/bin/update-pins-smoke
        run: bash modules/features/ci/_scripts/update_pins_smoke.sh live-upstream
      - name: Create disposable updater checkout
        env:
          UPDATE_PINS_CHECKOUT: ${{ runner.temp }}/update-pins-check
        run: bash modules/features/ci/_scripts/update_pins_smoke.sh create-checkout
      - name: Exercise production difit updater
        working-directory: ${{ runner.temp }}/update-pins-check
        run: bash modules/features/ci/_scripts/update_pins_smoke.sh exercise-updater
      - name: Wait for live upstream contracts
        wait: live-upstream
      - name: Verify repository remained unchanged
        if: always()
        run: bash modules/features/ci/_scripts/update_pins_smoke.sh verify-original
